# dvc.yaml  [The whole pipeline as one Data Version Control (DVC) stage]
# -------------------------------------------------------------------
# Purpose   Describe one reproducible pipeline stage, not separate steps
# Command   python -m src.main
# Depends   src, config.yaml, raw and inference data
# Outputs   processed data, model and predictions, all with cache: false
# Why       DVC records output hashes without caching these generated files
# Used by   you and ci.yml: dvc pull, then dvc repro (tracking disabled in CI)
# Commands  dvc pull, dvc repro, dvc status, dvc push
# Paired    dvc.lock records exact dependency and output hashes after dvc repro
# Setup     dvc init creates .dvc/; configure the DagsHub remote and keep credentials local
