# pytest.ini  [Test runner settings]
# Purpose   Tell pytest where tests live and how to run them: run "pytest" from the repo root
# Why       Same behaviour on every laptop and in CI; "import src..." works from any folder
# Kept as real settings on purpose: they are plumbing, not solution code
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__
addopts = -q
