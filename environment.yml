# environment.yml  [Dependencies, human-readable]
# -------------------------------------------------------------------
# Purpose   Short list of top-level packages and the Python version
# Used by   Humans: conda env create -f environment.yml
# Paired    conda-lock.yml is generated FROM this file. Change one, regenerate and commit both
#
# Typical groups
#   data and modelling      e.g. pandas, scikit-learn, joblib
#   config and secrets      YAML reader, .env loader
#   experiment tracking     e.g. wandb
#   serving                 web framework, server, data contract library, test client
#   notebooks               exploration only
#   quality                 test runner, coverage, style checker
#   locking                 conda-lock
